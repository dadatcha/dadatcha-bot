openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification for the Lotto Discord Bot dashboard
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: bot
  - name: economy
  - name: logs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bot/status:
    get:
      operationId: getBotStatus
      tags: [bot]
      summary: Get current bot connection status
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/config:
    get:
      operationId: getBotConfig
      tags: [bot]
      summary: Get reminder/channel configuration
      responses:
        "200":
          description: Current config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfig"
    put:
      operationId: updateBotConfig
      tags: [bot]
      summary: Update reminder/channel configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConfigInput"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfig"

  /bot/logs:
    get:
      operationId: getLogs
      tags: [logs]
      summary: Get recent bot activity logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
    post:
      operationId: addLog
      tags: [logs]
      summary: Append a log entry (called by the bot)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEntryInput"
      responses:
        "201":
          description: Logged

  /economy/config:
    get:
      operationId: getEconomyConfig
      tags: [economy]
      summary: Get economy command configuration
      responses:
        "200":
          description: Economy config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomyConfig"
    put:
      operationId: updateEconomyConfig
      tags: [economy]
      summary: Update economy command configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EconomyConfigInput"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomyConfig"

  /economy/players:
    get:
      operationId: listPlayers
      tags: [economy]
      summary: List all players with balances
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"

  /economy/players/{userId}:
    get:
      operationId: getPlayer
      tags: [economy]
      summary: Get one player's economy
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
    patch:
      operationId: updatePlayerBalance
      tags: [economy]
      summary: Set a player's wallet and/or bank
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerBalancePatch"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    BotStatus:
      type: object
      properties:
        connected:
          type: boolean
        botName:
          type: ["string", "null"]
        botId:
          type: ["string", "null"]
        uptimeSeconds:
          type: ["integer", "null"]
        lastReminderAt:
          type: ["string", "null"]
        remindersSentToday:
          type: integer
        lastSeenAt:
          type: ["string", "null"]
      required: [connected, botName, botId, uptimeSeconds, lastReminderAt, remindersSentToday, lastSeenAt]

    BotConfig:
      type: object
      properties:
        channelId:
          type: string
        reminderEnabled:
          type: boolean
        reminderIntervalMinutes:
          type: integer
        reminderMessage:
          type: string
      required: [channelId, reminderEnabled, reminderIntervalMinutes, reminderMessage]

    BotConfigInput:
      type: object
      properties:
        channelId:
          type: string
        reminderEnabled:
          type: boolean
        reminderIntervalMinutes:
          type: integer
        reminderMessage:
          type: string

    EconomyConfig:
      type: object
      properties:
        startingWallet:
          type: integer
        balanceEnabled:
          type: boolean
        moneyEnabled:
          type: boolean
        dailyEnabled:
          type: boolean
        dailyAmount:
          type: integer
        dailyCooldownHours:
          type: integer
        workEnabled:
          type: boolean
        workMinAmount:
          type: integer
        workMaxAmount:
          type: integer
        workCooldownHours:
          type: integer
        crimeEnabled:
          type: boolean
        crimeWinMin:
          type: integer
        crimeWinMax:
          type: integer
        crimeLoseMin:
          type: integer
        crimeLoseMax:
          type: integer
        crimeWinChance:
          type: integer
        crimeCooldownHours:
          type: integer
        depositEnabled:
          type: boolean
        withdrawEnabled:
          type: boolean
        giveEnabled:
          type: boolean
        leaderboardEnabled:
          type: boolean
        blackjackEnabled:
          type: boolean
        blackjackMaxBet:
          type: integer
        rouletteEnabled:
          type: boolean
        rouletteMaxBet:
          type: integer
        hlEnabled:
          type: boolean
      required:
        - startingWallet
        - balanceEnabled
        - moneyEnabled
        - dailyEnabled
        - dailyAmount
        - dailyCooldownHours
        - workEnabled
        - workMinAmount
        - workMaxAmount
        - workCooldownHours
        - crimeEnabled
        - crimeWinMin
        - crimeWinMax
        - crimeLoseMin
        - crimeLoseMax
        - crimeWinChance
        - crimeCooldownHours
        - depositEnabled
        - withdrawEnabled
        - giveEnabled
        - leaderboardEnabled
        - blackjackEnabled
        - blackjackMaxBet
        - rouletteEnabled
        - rouletteMaxBet
        - hlEnabled

    EconomyConfigInput:
      type: object
      properties:
        startingWallet:
          type: integer
        balanceEnabled:
          type: boolean
        moneyEnabled:
          type: boolean
        dailyEnabled:
          type: boolean
        dailyAmount:
          type: integer
        dailyCooldownHours:
          type: integer
        workEnabled:
          type: boolean
        workMinAmount:
          type: integer
        workMaxAmount:
          type: integer
        workCooldownHours:
          type: integer
        crimeEnabled:
          type: boolean
        crimeWinMin:
          type: integer
        crimeWinMax:
          type: integer
        crimeLoseMin:
          type: integer
        crimeLoseMax:
          type: integer
        crimeWinChance:
          type: integer
        crimeCooldownHours:
          type: integer
        depositEnabled:
          type: boolean
        withdrawEnabled:
          type: boolean
        giveEnabled:
          type: boolean
        leaderboardEnabled:
          type: boolean
        blackjackEnabled:
          type: boolean
        blackjackMaxBet:
          type: integer
        rouletteEnabled:
          type: boolean
        rouletteMaxBet:
          type: integer
        hlEnabled:
          type: boolean

    Player:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        wallet:
          type: integer
        bank:
          type: integer
        total:
          type: integer
        lastDaily:
          type: ["string", "null"]
        lastWork:
          type: ["string", "null"]
        lastCrime:
          type: ["string", "null"]
        updatedAt:
          type: string
      required: [userId, username, wallet, bank, total, lastDaily, lastWork, lastCrime, updatedAt]

    PlayerBalancePatch:
      type: object
      properties:
        wallet:
          type: integer
        bank:
          type: integer

    LogEntry:
      type: object
      properties:
        id:
          type: integer
        level:
          type: string
        message:
          type: string
        createdAt:
          type: string
      required: [id, level, message, createdAt]

    LogEntryInput:
      type: object
      properties:
        level:
          type: string
        message:
          type: string
      required: [level, message]
