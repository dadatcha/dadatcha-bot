openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification for the Lotto Discord Bot dashboard
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: bot
  - name: economy
  - name: shop
  - name: roles
  - name: commands
  - name: logs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bot/status:
    get:
      operationId: getBotStatus
      tags: [bot]
      summary: Get current bot connection status
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/config:
    get:
      operationId: getBotConfig
      tags: [bot]
      summary: Get reminder/channel configuration
      responses:
        "200":
          description: Current config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfig"
    put:
      operationId: updateBotConfig
      tags: [bot]
      summary: Update reminder/channel configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConfigInput"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfig"

  /bot/reminders:
    get:
      operationId: listReminders
      tags: [bot]
      summary: List all reminders
      responses:
        "200":
          description: Reminders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
    post:
      operationId: createReminder
      tags: [bot]
      summary: Create a new reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "201":
          description: Created reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"

  /bot/reminders/{id}:
    put:
      operationId: updateReminder
      tags: [bot]
      summary: Update a reminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "200":
          description: Updated reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "404":
          description: Not found
    delete:
      operationId: deleteReminder
      tags: [bot]
      summary: Delete a reminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /bot/logs:
    get:
      operationId: getLogs
      tags: [logs]
      summary: Get recent bot activity logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
    post:
      operationId: addLog
      tags: [logs]
      summary: Append a log entry (called by the bot)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEntryInput"
      responses:
        "201":
          description: Logged

  /economy/config:
    get:
      operationId: getEconomyConfig
      tags: [economy]
      summary: Get economy command configuration
      responses:
        "200":
          description: Economy config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomyConfig"
    put:
      operationId: updateEconomyConfig
      tags: [economy]
      summary: Update economy command configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EconomyConfigInput"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomyConfig"

  /economy/players:
    get:
      operationId: listPlayers
      tags: [economy]
      summary: List all players with balances
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"

  /economy/players/{userId}:
    get:
      operationId: getPlayer
      tags: [economy]
      summary: Get one player's economy
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
    patch:
      operationId: updatePlayerBalance
      tags: [economy]
      summary: Set a player's wallet and/or bank
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerBalancePatch"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found

  /shop/items:
    get:
      operationId: listShopItems
      tags: [shop]
      summary: List all shop items
      responses:
        "200":
          description: List of shop items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopItem"
    post:
      operationId: createShopItem
      tags: [shop]
      summary: Create a new shop item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopItem"

  /shop/items/{id}:
    put:
      operationId: updateShopItem
      tags: [shop]
      summary: Update a shop item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopItemInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopItem"
        "404":
          description: Not found
    delete:
      operationId: deleteShopItem
      tags: [shop]
      summary: Delete a shop item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /command-configs:
    get:
      operationId: listCommandConfigs
      tags: [commands]
      summary: List all command configs (merged with defaults)
      responses:
        "200":
          description: List of command configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommandConfig"

  /command-configs/{name}:
    put:
      operationId: updateCommandConfig
      tags: [commands]
      summary: Update a command config (upsert)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandConfigInput"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandConfig"
        "404":
          description: Unknown command

  /role-rewards:
    get:
      operationId: listRoleRewards
      tags: [roles]
      summary: List all role reward rules
      responses:
        "200":
          description: List of rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleReward"
    post:
      operationId: createRoleReward
      tags: [roles]
      summary: Create a role reward rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRewardInput"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleReward"

  /role-rewards-sync:
    post:
      operationId: triggerRoleRewardsSync
      tags: [roles]
      summary: Request a full sync of role reward rules to all guild members
      responses:
        "201":
          description: Sync job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJob"
    get:
      operationId: getLatestRoleRewardsSync
      tags: [roles]
      summary: Get the latest sync job status
      responses:
        "200":
          description: Latest sync job (null when none exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJob"

  /role-rewards/{id}:
    put:
      operationId: updateRoleReward
      tags: [roles]
      summary: Update a role reward rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRewardInput"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleReward"
        "404":
          description: Not found
    delete:
      operationId: deleteRoleReward
      tags: [roles]
      summary: Delete a role reward rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    BotStatus:
      type: object
      properties:
        connected:
          type: boolean
        botName:
          type: ["string", "null"]
        botId:
          type: ["string", "null"]
        uptimeSeconds:
          type: ["integer", "null"]
        lastReminderAt:
          type: ["string", "null"]
        remindersSentToday:
          type: integer
        lastSeenAt:
          type: ["string", "null"]
      required: [connected, botName, botId, uptimeSeconds, lastReminderAt, remindersSentToday, lastSeenAt]

    BotConfig:
      type: object
      properties:
        channelId:
          type: string
        reminderEnabled:
          type: boolean
        reminderIntervalMinutes:
          type: integer
        reminderMessage:
          type: string
      required: [channelId, reminderEnabled, reminderIntervalMinutes, reminderMessage]

    BotConfigInput:
      type: object
      properties:
        channelId:
          type: string
        reminderEnabled:
          type: boolean
        reminderIntervalMinutes:
          type: integer
        reminderMessage:
          type: string

    Reminder:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        channelId:
          type: string
        enabled:
          type: boolean
        intervalMinutes:
          type: integer
        message:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, channelId, enabled, intervalMinutes, message, createdAt, updatedAt]

    ReminderInput:
      type: object
      properties:
        name:
          type: string
        channelId:
          type: string
        enabled:
          type: boolean
        intervalMinutes:
          type: integer
        message:
          type: string
      required: [name, channelId, intervalMinutes, message]

    ShopItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: integer
        roleId:
          type: ["string", "null"]
        emoji:
          type: string
        enabled:
          type: boolean
        position:
          type: integer
        createdAt:
          type: string
      required: [id, name, description, price, roleId, emoji, enabled, position, createdAt]

    ShopItemInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: integer
        roleId:
          type: string
        emoji:
          type: string
        enabled:
          type: boolean
        position:
          type: integer
      required: [name, price]

    EconomyConfig:
      type: object
      properties:
        startingWallet:
          type: integer
        balanceEnabled:
          type: boolean
        moneyEnabled:
          type: boolean
        dailyEnabled:
          type: boolean
        dailyAmount:
          type: integer
        dailyCooldownHours:
          type: integer
        workEnabled:
          type: boolean
        workMinAmount:
          type: integer
        workMaxAmount:
          type: integer
        workCooldownHours:
          type: integer
        crimeEnabled:
          type: boolean
        crimeWinMin:
          type: integer
        crimeWinMax:
          type: integer
        crimeLoseMin:
          type: integer
        crimeLoseMax:
          type: integer
        crimeWinChance:
          type: integer
        crimeCooldownHours:
          type: integer
        depositEnabled:
          type: boolean
        withdrawEnabled:
          type: boolean
        giveEnabled:
          type: boolean
        leaderboardEnabled:
          type: boolean
        blackjackEnabled:
          type: boolean
        blackjackMaxBet:
          type: integer
        rouletteEnabled:
          type: boolean
        rouletteMaxBet:
          type: integer
        hlEnabled:
          type: boolean
        currencyName:
          type: string
        messageRewardEnabled:
          type: boolean
        messageRewardMin:
          type: integer
        messageRewardMax:
          type: integer
        messageRewardCooldownSeconds:
          type: integer
      required:
        - startingWallet
        - balanceEnabled
        - moneyEnabled
        - dailyEnabled
        - dailyAmount
        - dailyCooldownHours
        - workEnabled
        - workMinAmount
        - workMaxAmount
        - workCooldownHours
        - crimeEnabled
        - crimeWinMin
        - crimeWinMax
        - crimeLoseMin
        - crimeLoseMax
        - crimeWinChance
        - crimeCooldownHours
        - depositEnabled
        - withdrawEnabled
        - giveEnabled
        - leaderboardEnabled
        - blackjackEnabled
        - blackjackMaxBet
        - rouletteEnabled
        - rouletteMaxBet
        - hlEnabled
        - currencyName
        - messageRewardEnabled
        - messageRewardMin
        - messageRewardMax
        - messageRewardCooldownSeconds

    EconomyConfigInput:
      type: object
      properties:
        startingWallet:
          type: integer
        balanceEnabled:
          type: boolean
        moneyEnabled:
          type: boolean
        dailyEnabled:
          type: boolean
        dailyAmount:
          type: integer
        dailyCooldownHours:
          type: integer
        workEnabled:
          type: boolean
        workMinAmount:
          type: integer
        workMaxAmount:
          type: integer
        workCooldownHours:
          type: integer
        crimeEnabled:
          type: boolean
        crimeWinMin:
          type: integer
        crimeWinMax:
          type: integer
        crimeLoseMin:
          type: integer
        crimeLoseMax:
          type: integer
        crimeWinChance:
          type: integer
        crimeCooldownHours:
          type: integer
        depositEnabled:
          type: boolean
        withdrawEnabled:
          type: boolean
        giveEnabled:
          type: boolean
        leaderboardEnabled:
          type: boolean
        blackjackEnabled:
          type: boolean
        blackjackMaxBet:
          type: integer
        rouletteEnabled:
          type: boolean
        rouletteMaxBet:
          type: integer
        hlEnabled:
          type: boolean
        currencyName:
          type: string
        messageRewardEnabled:
          type: boolean
        messageRewardMin:
          type: integer
        messageRewardMax:
          type: integer
        messageRewardCooldownSeconds:
          type: integer

    Player:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        wallet:
          type: integer
        bank:
          type: integer
        total:
          type: integer
        rank:
          type: integer
        lastDaily:
          type: ["string", "null"]
        lastWork:
          type: ["string", "null"]
        lastCrime:
          type: ["string", "null"]
        updatedAt:
          type: string
      required: [userId, username, wallet, bank, total, rank, lastDaily, lastWork, lastCrime, updatedAt]

    PlayerBalancePatch:
      type: object
      properties:
        wallet:
          type: integer
        bank:
          type: integer

    CommandConfig:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        description:
          type: string
        category:
          type: string
        enabled:
          type: boolean
        adminOnly:
          type: boolean
      required: [name, label, description, category, enabled, adminOnly]

    CommandConfigInput:
      type: object
      properties:
        enabled:
          type: boolean
        adminOnly:
          type: boolean
        label:
          type: string

    RoleReward:
      type: object
      properties:
        id:
          type: integer
        triggerRoleId:
          type: string
        rewardRoleId:
          type: string
        removeRoleId:
          type: ["string", "null"]
        enabled:
          type: boolean
        createdAt:
          type: string
      required: [id, triggerRoleId, rewardRoleId, removeRoleId, enabled, createdAt]

    SyncJob:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        total:
          type: ["integer", "null"]
        processed:
          type: ["integer", "null"]
        errors:
          type: ["integer", "null"]
        requestedAt:
          type: string
        completedAt:
          type: ["string", "null"]
      required: [id, status, total, processed, errors, requestedAt, completedAt]

    RoleRewardInput:
      type: object
      properties:
        triggerRoleId:
          type: string
        rewardRoleId:
          type: string
        removeRoleId:
          type: string
        enabled:
          type: boolean
      required: [triggerRoleId]

    LogEntry:
      type: object
      properties:
        id:
          type: integer
        level:
          type: string
        message:
          type: string
        createdAt:
          type: string
      required: [id, level, message, createdAt]

    LogEntryInput:
      type: object
      properties:
        level:
          type: string
        message:
          type: string
      required: [level, message]
