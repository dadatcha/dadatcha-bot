services:
  # ── 1. Discord Bot (Web Service gratuit — bind $PORT via aiohttp health server) ──
  - type: web
    name: dadatcha-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      # Token du bot Discord → régénérer sur discord.com/developers si expiré
      - key: DISCORD_TOKEN
        sync: false
      # URL de l'API server déployée, ex: https://dadatcha-api.onrender.com/api
      - key: API_BASE
        sync: false

  # ── 2. API Server (Web Service Node.js — base de données + logique métier) ──
  - type: web
    name: dadatcha-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npx --yes pnpm@9 install --no-frozen-lockfile && npx pnpm@9 --filter @workspace/api-server run build
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    envVars:
      # URL de la base PostgreSQL Replit (Settings → Database → External URL)
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PORT
        value: "10000"

  # ── 3. Dashboard (Web Service gratuit — serveur statique Node.js) ───────────
  - type: web
    name: dadatcha-dashboard
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npx --yes pnpm@9 install --no-frozen-lockfile && npx pnpm@9 --filter @workspace/dashboard run build
    startCommand: npx serve -s ./artifacts/dashboard/dist/public -l $PORT
    envVars:
      # URL du service dadatcha-api ci-dessus, ex: https://dadatcha-api.onrender.com
      - key: VITE_API_URL
        sync: false
      - key: BASE_PATH
        value: "/"
